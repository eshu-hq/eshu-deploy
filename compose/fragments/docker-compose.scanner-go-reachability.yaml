# Overlay for the #10031 remote-e2e go-reachability driver
# (eshu-hq/eshu-deploy#40, part of eshu-hq/eshu#10002).
#
# It mirrors the collector-vulnerability-intelligence seed/reconcile shape in
# compose/docker-compose.remote-e2e.seed.yaml: a digest-pinned satellite seed
# image installs the component into a shared component home, a reconcile
# one-shot writes the activation file and grants the component, and the
# worker runs the component-extension host over that home.
#
# The seed image pins the v0.1.0 scanner-go-reachability release
# (ghcr.io/eshu-hq/scanner-go-reachability@sha256:8e4059a2acbd020a761862a8196e25567b7119bb97ef42a228432c59f5e39284,
# multi-arch): the literal pin replaces the release-gated
# ESHU_SCANNER_GOREACHABILITY_SEED_IMAGE variable now that the release
# exists, so including this fragment pulls the reviewed digest with no
# export step and no floating tag.
#
# Usage (from repo root):
#   docker compose \
#     -f compose/docker-compose.remote-e2e.yaml \
#     -f compose/fragments/docker-compose.scanner-go-reachability.yaml \
#     up -d collector-go-reachability
#
# The grants below mirror the scanner RequiredGrants set eshu core admission
# enforces for eshu.scanner.go-reachability (vulnerability.go_module_evidence,
# vulnerability.go_call_reachability, vulnerability.warning,
# scanner_worker.warning). The activation config carries only
# allowed_clone_hosts: the component refuses static targets and
# acceptance_unit_id there and takes its repository target from the
# host-derived claim, with the host-minted token reaching github.com alone
# unless the operator widens the list.
#
# Like compose/fragments/*, this file has no in-tree consumer yet; yamllint
# judges its syntax until the #10031 driver lands, at which point the
# driver's combo case joins scripts/ci/compose.sh.

services:
  # One-shot: copy the component binary and manifest out of the release seed
  # image into the shared component home. Runs as root so the seeded files
  # land in the fresh root-owned named volume; the reconcile step hands
  # ownership to the runtime uid when the registry is ready.
  collector-go-reachability-seed:
    image: ghcr.io/eshu-hq/scanner-go-reachability@sha256:8e4059a2acbd020a761862a8196e25567b7119bb97ef42a228432c59f5e39284
    restart: "no"
    user: "0:0"
    # NOTE: no binary path here — the image ENTRYPOINT already is the
    # component binary, so command argv starts at the `seed` subcommand.
    # Repeating the binary path makes it argv[1] and the binary falls
    # through to Runner mode, failing on empty stdin.
    command: ["seed", "--dest", "/components/runtime/remote-e2e-go-reachability", "--image-ref", "ghcr.io/eshu-hq/scanner-go-reachability@sha256:8e4059a2acbd020a761862a8196e25567b7119bb97ef42a228432c59f5e39284"]
    volumes:
      - go_reachability_component_home:/components

  # One-shot: verify the seed, write the activation file, then grant,
  # install, and enable the component (host image, has sh). The worker
  # starts only after this exits 0.
  collector-go-reachability-reconcile:
    build:
      context: ${ESHU_REPO_ROOT:-.}
      dockerfile: Dockerfile
    restart: "no"
    user: "0:0"
    environment:
      ESHU_COMPONENT_HOME: /components
      COMPONENT_ID: eshu.scanner.go-reachability
      COMPONENT_VERSION: 0.1.0
      INSTANCE_ID: remote-e2e-go-reachability
      MODE: scheduled
      CONFIG_PATH: /components/activations/remote-e2e-go-reachability.yaml
      ALLOW_IDS: eshu.scanner.go-reachability
      ALLOW_PUBLISHERS: eshu-hq
    volumes:
      - go_reachability_component_home:/components
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        home="$${ESHU_COMPONENT_HOME:?ESHU_COMPONENT_HOME must be set}"
        runtime="$${home}/runtime/$${INSTANCE_ID:?INSTANCE_ID must be set}"
        if [ ! -x "$${runtime}/collector" ] || [ ! -s "$${runtime}/manifest.yaml" ]; then
          echo "seed image did not write $${runtime}/collector and $${runtime}/manifest.yaml" >&2
          exit 1
        fi
        mkdir -p "$$(dirname "$${CONFIG_PATH:?CONFIG_PATH must be set}")"
        cat > "$${CONFIG_PATH}" <<'ACTIVATION'
        config:
          allowed_clone_hosts: ["github.com"]
        host:
          scope:
            id: "go-reachability:remote-e2e"
            kind: repository_source
          sourceSystem: scanner_worker
        process:
          # The seeded runtime collector runs through the process adapter
          # over collector-sdk/v1alpha3 stdio (no extra argv: the binary
          # dispatches `seed` only as argv[1], anything else runs the
          # stateless call loop). Path is the seed --dest runtime dir.
          command: /components/runtime/remote-e2e-go-reachability/collector
          stdout_limit_bytes: 67108864
        ACTIVATION
        eshu component grant "$${COMPONENT_ID}" --component-home "$${home}" --version "$${COMPONENT_VERSION}" --kind 'vulnerability.go_module_evidence' --schema-version '1.0.0' --scope 'scanner_worker' --expires-in '720h'
        eshu component grant "$${COMPONENT_ID}" --component-home "$${home}" --version "$${COMPONENT_VERSION}" --kind 'vulnerability.go_call_reachability' --schema-version '1.0.0' --scope 'scanner_worker' --expires-in '720h'
        eshu component grant "$${COMPONENT_ID}" --component-home "$${home}" --version "$${COMPONENT_VERSION}" --kind 'vulnerability.warning' --schema-version '1.0.0' --scope 'scanner_worker' --expires-in '720h'
        eshu component grant "$${COMPONENT_ID}" --component-home "$${home}" --version "$${COMPONENT_VERSION}" --kind 'scanner_worker.warning' --schema-version '1.0.0' --scope 'scanner_worker' --expires-in '720h'
        eshu component install "$${runtime}/manifest.yaml" --component-home "$${home}" --trust-mode allowlist --allow-id "$${ALLOW_IDS}" --allow-publisher "$${ALLOW_PUBLISHERS}"
        status=0
        out="$$(eshu component enable "$${COMPONENT_ID}" --component-home "$${home}" --instance "$${INSTANCE_ID}" --mode "$${MODE}" --claims --config "$${CONFIG_PATH}" 2>&1)" || status=$$?
        printf '%s\n' "$${out}"
        if [ "$${status}" -ne 0 ]; then
          case "$${out}" in
            *"activation \"$${INSTANCE_ID}\" is already enabled for component \"$${COMPONENT_ID}\""*)
              echo "activation $${INSTANCE_ID} already enabled; continuing"
              ;;
            *) exit "$${status}" ;;
          esac
        fi
        chown -R 10001:10001 "$${home}"
    depends_on:
      collector-go-reachability-seed:
        condition: service_completed_successfully

  # Extension-host worker: the Eshu image stays the host and runs the
  # seeded component over the component home the one-shots fill first. The
  # #10031 driver adds the runtime dependencies (projector,
  # workflow-coordinator) when it includes this fragment beside the root
  # remote-e2e stack.
  collector-go-reachability:
    build:
      context: ${ESHU_REPO_ROOT:-.}
      dockerfile: Dockerfile
    restart: on-failure
    command: ["/usr/local/bin/eshu-collector-component-extension"]
    environment:
      ESHU_COMPONENT_HOME: /components
      ESHU_COMPONENT_TRUST_MODE: allowlist
      ESHU_COMPONENT_ALLOW_IDS: eshu.scanner.go-reachability
      ESHU_COMPONENT_ALLOW_PUBLISHERS: eshu-hq
      ESHU_COMPONENT_COLLECTOR_INSTANCE_ID: remote-e2e-go-reachability
      ESHU_COMPONENT_COLLECTOR_OWNER_ID: remote-e2e-go-reachability-worker
      ESHU_COMPONENT_COLLECTOR_SCOPE_KIND: repository_source
      ESHU_COMPONENT_COLLECTOR_POLL_INTERVAL: ${ESHU_GOREACHABILITY_POLL_INTERVAL:-2s}
      ESHU_COMPONENT_COLLECTOR_CLAIM_LEASE_TTL: ${ESHU_GOREACHABILITY_CLAIM_LEASE_TTL:-60s}
      ESHU_COMPONENT_COLLECTOR_HEARTBEAT_INTERVAL: ${ESHU_GOREACHABILITY_HEARTBEAT_INTERVAL:-10s}
    volumes:
      - go_reachability_component_home:/components
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      collector-go-reachability-seed:
        condition: service_completed_successfully
      collector-go-reachability-reconcile:
        condition: service_completed_successfully

volumes:
  go_reachability_component_home:
